<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Camelot | Monka Games</title>
    <link rel="icon" href="/favicon.ico" />
    <script>
      // set the theme before the first paint (theme.js keeps it up to date)
      try {
        var root = document.documentElement;
        var saved = localStorage.getItem('theme');
        if (saved !== 'light' && saved !== 'dark') {
          saved = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        } else {
          root.dataset.theme = saved;
        }
        root.dataset.effective = saved;
      } catch (e) {}
    </script>
    <script type="module" src="/src/camelot/main.js"></script>
  </head>
  <body>
    <div id="lobby" class="lobby">
      <div class="bunting" aria-hidden="true"></div>
      <div class="skyline" aria-hidden="true"></div>

      <div class="card lobby-card stack">
        <button class="icon-btn theme-toggle" type="button" aria-label="Switch theme">
          <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5" /><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8" /></svg>
          <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z" /></svg>
        </button>

        <header class="lobby-head">
          <svg class="crest" viewBox="0 0 100 120" aria-hidden="true"><use href="#crest" /></svg>
          <div class="stack tight">
            <h1 class="display">Camelot</h1>
            <p class="muted">A game of knights and men for two players.</p>
          </div>
        </header>

        <section id="menu" class="stack">
          <form id="new-game" class="stack">
            <fieldset class="sides">
              <legend>Play as</legend>
              <label>
                <input type="radio" name="side" value="white" />
                <svg class="shield" viewBox="0 0 100 120" aria-hidden="true"><use href="#shield-white" /></svg>
                White
                <small>moves first</small>
              </label>
              <label>
                <input type="radio" name="side" value="black" />
                <svg class="shield" viewBox="0 0 100 120" aria-hidden="true"><use href="#shield-black" /></svg>
                Black
              </label>
              <label>
                <input type="radio" name="side" value="random" checked />
                <svg class="shield" viewBox="0 0 100 120" aria-hidden="true"><use href="#shield-random" /></svg>
                Random
              </label>
            </fieldset>
            <button class="btn primary" type="submit">New game</button>
          </form>

          <p class="divider muted"><span>or join a friend</span></p>

          <form id="join-game" class="row">
            <input name="gamecode" required placeholder="Game code" aria-label="Game code" autocomplete="off" autocapitalize="off" spellcheck="false" />
            <button class="btn" type="submit">Join</button>
          </form>
        </section>

        <section id="waiting" class="stack" hidden>
          <p>Send this link to your opponent:</p>
          <div class="row">
            <output id="invite-link" class="invite"></output>
            <button id="copy" class="btn" type="button">Copy</button>
          </div>
          <p class="muted">Or give them the code <code id="game-code"></code></p>
          <p class="waiting muted">Waiting for a challenger</p>
          <button id="cancel" class="btn ghost" type="button">Cancel</button>
        </section>
      </div>
    </div>

    <div id="game" class="game" hidden>
      <header class="topbar">
        <a class="brand display" href="/games/camelot/">
          <svg class="crest" viewBox="0 0 100 120" aria-hidden="true"><use href="#crest" /></svg>
          Camelot
        </a>
        <div id="status" class="status" role="status" aria-live="polite"></div>
        <button class="icon-btn theme-toggle" type="button" aria-label="Switch theme">
          <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5" /><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8" /></svg>
          <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z" /></svg>
        </button>

      </header>

      <main class="layout">
        <section class="board-wrap" aria-label="Game board">
          <svg id="board" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Camelot board"></svg>
        </section>

        <aside class="side">
          <section class="panel players" id="players" aria-label="Players"></section>

          <section class="panel controls">
            <p id="hint" class="hint"></p>
            <p id="notice" class="notice" role="alert"></p>
            <div class="row">
              <button id="undo" class="btn" type="button">Undo</button>
              <button id="end-turn" class="btn primary" type="button">End turn</button>
            </div>
          </section>

          <section class="panel chat">
            <h2>Chat</h2>
            <ol id="chat-log" class="chat-log" aria-live="polite"></ol>
            <form id="chat-form" class="row">
              <input name="text" placeholder="Message" aria-label="Message" autocomplete="off" maxlength="500" />
              <button class="btn" type="submit">Send</button>
            </form>
          </section>
        </aside>
      </main>
    </div>

    <dialog id="over">
      <h2 id="over-title"></h2>
      <p id="over-text"></p>
      <div class="row">
        <button id="play-again" class="btn primary" type="button">Play again</button>
        <a class="btn" href="/games/camelot/">Back to menu</a>
      </div>
    </dialog>

    <dialog id="problem">
      <h2>Something went wrong</h2>
      <p id="problem-text"></p>
      <a class="btn primary" href="/games/camelot/">Back to menu</a>
    </dialog>
  </body>
</html>
