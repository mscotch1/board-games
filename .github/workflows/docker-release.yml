name: Publish Docker image

# Pushing a version tag (e.g. v1.2.0) tests the code, then builds the image and
# pushes it to ghcr.io/<owner>/<repo> as 1.2.0, 1.2 and latest.
on:
  push:
    tags:
      - "v*"

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the GitHub release
      packages: write
    steps:
      - uses: actions/checkout@v4

      # lets the runner build the arm64 image too (Raspberry Pi, Apple silicon servers)
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Note when this was built
        run: echo "APP_BUILT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # shown in the page footer and reported by /version
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            APP_COMMIT=${{ github.sha }}
            APP_BUILT=${{ env.APP_BUILT }}
            SITE_URL=${{ vars.SITE_URL }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # a GitHub release for the tag, with notes written from the commits and pull requests since the last one
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Image: `ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}` (amd64 and arm64)
