name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest

      # requirements.txt pins every package the server uses, and is generated from requirements.in;
      # this fails if someone edited one without regenerating the other
      - uses: astral-sh/setup-uv@v5
      - name: requirements.txt is up to date with requirements.in
        run: |
          uv pip compile requirements.in --python-platform linux --python-version 3.12 -o requirements.txt
          git diff --exit-code requirements.txt

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  # Builds the real image and starts it, so a mistake in the Dockerfile (a file it forgets to copy,
  # a permission it needs) fails here and not on the first deployment.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: board-games:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start it and check it works
        run: |
          docker run -d --name board-games -p 5000:5000 board-games:ci
          for attempt in $(seq 1 30); do
            curl -fsS http://localhost:5000/healthz && break
            sleep 1
          done
          curl -fsS http://localhost:5000/healthz | grep '"status":"ok"'
          curl -fsS http://localhost:5000/version
          curl -fsS http://localhost:5000/games/camelot/rules/ | grep -q 'How to play'
          curl -fsSI http://localhost:5000/ | grep -i '^content-security-policy'
          test "$(docker exec board-games id -u)" = "10001"
          docker exec board-games sh -c 'touch /data/writable-check && rm /data/writable-check'
      - name: Show the container's log if something failed
        if: failure()
        run: docker logs board-games
