# Weekly pull requests for out-of-date dependencies, so security fixes don't wait for someone to notice.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: "/client"
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  # the digests pinned in the Dockerfile's FROM lines
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
