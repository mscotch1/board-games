# An example docker compose file for running the published image. Copy it, edit it, and run
# `docker compose up -d`. See "Running with Docker" and "Cloudflare" in the README.
services:
  board-games:
    image: ghcr.io/mscotch1/board-games:latest # pin a version (e.g. :1.0.0) to control when you upgrade
    restart: unless-stopped
    ports:
      - "5000:5000" # or leave it out and let a tunnel / reverse proxy reach the container
    environment:
      # behind Cloudflare: the real client address, for the new-games rate limit
      CLIENT_IP_HEADER: CF-Connecting-IP
      # once the site is served over HTTPS, tell browsers to keep using it (seconds; one year here)
      # HSTS_MAX_AGE: "31536000"
      # only if your proxy rewrites the Host header, so sockets are refused
      # CORS_ALLOWED_ORIGINS: https://games.example.com
      # how long to keep games, and how often to back them up (these are the defaults)
      # GAME_TTL_DAYS: "7"
      # BACKUP_INTERVAL_HOURS: "24"
      # BACKUP_KEEP: "7"
      # for backups that survive losing the data volume, send them to a second volume or a mounted disk
      # BACKUP_DIR: /backups
    volumes:
      - board-games-data:/data
      # - board-games-backups:/backups
    # the image has its own health check (/healthz); `docker ps` shows healthy or unhealthy
    # the container runs as uid 10001; a bind mount (./data:/data) must be writable by it:
    #   mkdir data && sudo chown 10001 data

volumes:
  board-games-data:
  # board-games-backups:
